<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>周末去哪吃</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a single-column sticker book. Each restaurant is one "page", divided by stitched seams; the embroidered-patch motif from the cover photo runs through buttons and labels. Single light theme by choice (paper look). */
:root{
  --paper:#FFF8F6; --paper-dot:#F5E4E7; --card:#FFFFFF;
  --ink:#2A3555; --ink-2:#5D6785; --ink-3:#9AA1B6;
  --line:#EDD8DC;
  --sky:#6F9BD6; --sky-soft:#E4EDF9;
  --pink:#E995AC; --pink-soft:#FBE4EB;
  --apple:#D43B30; --apple-soft:#FCE3DF;
  --leaf:#5F9670; --leaf-soft:#E1EFE4;
  --butter:#D9AE3C; --butter-soft:#FBF1D3;
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-cute:"ZCOOL KuaiLe","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--paper);
  background-image:radial-gradient(var(--paper-dot) 1.1px, transparent 1.4px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
.wrap.wide{max-width:900px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.cute{font-family:var(--f-cute);letter-spacing:.04em}

/* ---------- cover ---------- */
.cover{display:grid;gap:28px;align-items:center;justify-items:center;padding-block:48px 36px}
.cover h1{justify-self:center;text-align:center}
@media (min-width:720px){.cover{grid-template-columns:1fr 1fr;column-gap:40px;padding-block:72px 48px}.cover h1,.cover .start{grid-column:1/-1}.cover h1{justify-self:center;text-align:center}}
.meme{position:relative;margin:0;width:min(330px,82%);background:var(--card);padding:10px;border-radius:20px;transform:rotate(-2.5deg);
  box-shadow:0 1px 0 var(--line),0 18px 34px -18px rgba(42,53,85,.45);animation:drop .9s cubic-bezier(.2,.9,.3,1.3) both}
.meme img{display:block;width:100%;height:auto;border-radius:12px}
.tape{position:absolute;top:-11px;width:78px;height:24px;opacity:.85;z-index:1;background:repeating-linear-gradient(45deg,var(--pink) 0 7px,var(--pink-soft) 7px 14px)}
.tape.l{left:-16px;transform:rotate(-28deg)}
.tape.r{right:-16px;transform:rotate(24deg);background:repeating-linear-gradient(45deg,var(--sky) 0 7px,var(--sky-soft) 7px 14px)}
@keyframes drop{from{transform:translateY(-24px) rotate(-8deg);opacity:0}to{transform:rotate(-2.5deg);opacity:1}}
.eyebrow{font-family:var(--f-cute);color:var(--apple);font-size:15px;letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.cover h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,60px);line-height:1.18;letter-spacing:.02em;margin-top:14px}
.cover h1 em{font-style:normal;color:var(--apple);position:relative;white-space:nowrap;z-index:0}
.cover h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:.06em;height:.28em;background:var(--pink-soft);z-index:-1;border-radius:6px}
.lede{margin-top:18px;color:var(--ink-2);font-size:16.5px;max-width:30em}
.facts-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.facts-row span{font-size:13px;color:var(--ink-2);background:var(--card);border-radius:999px;padding:5px 12px;box-shadow:0 0 0 1px var(--line)}
.start{display:grid;place-items:center;width:54px;height:54px;background:var(--ink);color:#fff;border-radius:50%;text-decoration:none;transition:transform .2s;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.start:hover{transform:translateY(-2px)}
.start svg{width:20px;height:20px}
.photo-col{position:relative;min-width:0}
.scene{display:block;width:100%;max-width:520px;height:auto;margin-inline:auto;overflow:visible}
.scene .bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.scene .bob.b2{animation-delay:-1.7s}
.scene a .dish-stk{transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
.scene a:hover .dish-stk,.scene a:focus-visible .dish-stk{transform:scale(1.1) rotate(-4deg)}
.scene text{font-family:var(--f-cute);font-size:19px;letter-spacing:.08em;fill:var(--ink-2)}
.scene .twk{animation:twinkle 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene-hint{text-align:center;font-family:var(--f-cute);font-size:13px;color:var(--ink-3);letter-spacing:.08em;margin-top:2px}
@keyframes bob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-3px)}}
@keyframes twinkle{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(14deg) scale(1.1)}}
.with-kid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.with-kid > div{min-width:0}
.kid{flex:none;width:92px;height:auto;margin-bottom:-6px}

/* ---------- sticky progress ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,248,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1.5px dashed var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.nav-label{font-family:var(--f-cute);font-size:14px;color:var(--ink-2);letter-spacing:.06em;white-space:nowrap}
.dots{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--ink-3);background:transparent;font-family:var(--f-cute);font-size:13px;color:var(--ink-2);display:grid;place-items:center;padding:0;transition:all .2s}
.dots button.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
.dots button[data-state="yes"]{background:var(--apple);border:1.5px solid var(--apple);color:#fff}
.dots button[data-state="maybe"]{background:var(--leaf);border:1.5px solid var(--leaf);color:#fff}
.dots button[data-state="no"]{background:var(--line);border:1.5px solid var(--line);color:var(--ink-3)}
.dots .final-dot{width:auto;border-radius:999px;padding:0 10px}

/* ---------- restaurant page ---------- */
.spot{padding-block:56px 48px;scroll-margin-top:60px}
.seam{display:flex;align-items:center;gap:14px;color:var(--pink)}
.seam::before,.seam::after{content:"";flex:1;border-top:2px dashed var(--line)}
.seam svg{width:26px;height:26px}
.count{font-family:var(--f-cute);font-size:14px;color:var(--ink-3);letter-spacing:.1em}
.head-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:10px}
.patch{display:inline-block;font-family:var(--f-cute);font-size:14px;letter-spacing:.08em;color:var(--ink);background:var(--ts);border-radius:999px;padding:6px 15px;outline:1.5px dashed var(--t);outline-offset:-5px}
.spot .latin + .block,.spot h2 + .block{margin-top:28px}
.spot h2{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,44px);line-height:1.2;letter-spacing:.04em;margin-top:12px}
.latin{font-size:12px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--ink-3);letter-spacing:.1em}
.facts dd{margin:2px 0 0;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.block{margin-top:34px}
.label{display:flex;align-items:center;gap:7px;font-family:var(--f-cute);font-size:16px;letter-spacing:.08em;color:var(--ink)}
.label svg{width:17px;height:17px;color:var(--t)}
.label small{font-family:var(--f-body);font-size:12px;color:var(--ink-3);letter-spacing:0;margin-left:auto}

.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:14px;padding-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{flex:0 0 min(74%,330px);margin:0;scroll-snap-align:start;min-width:0}
.gallery .frame{aspect-ratio:4/5}
.frame{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:18px;overflow:hidden;background:var(--ts)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(.97) brightness(1.02)}
.frame::after{content:"";position:absolute;inset:7px;border-radius:13px;border:1.5px dashed rgba(255,255,255,.75);pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;
  background-image:radial-gradient(color-mix(in srgb,var(--t) 28%,transparent) 1.4px,transparent 1.8px);background-size:16px 16px}
.ph b{font-family:var(--f-cute);font-weight:400;font-size:18px;color:var(--ink-2);letter-spacing:.1em}
.ph span{font-size:12px;color:var(--ink-3)}
.ph svg{width:30px;height:30px;color:var(--t)}
figcaption{font-size:13px;color:var(--ink-2);margin-top:8px;padding-left:4px}

.menu{list-style:none;margin:12px 0 0;padding:0}
.menu li{border-bottom:1px solid var(--line)}
.dish{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 2px 12px}
.dish-top{display:flex;align-items:baseline;gap:10px}
.dish-name{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.03em;white-space:nowrap}
.leader{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.see{font-family:var(--f-cute);font-size:13px;color:var(--t);white-space:nowrap;display:flex;align-items:center;gap:3px}
.see svg{width:12px;height:12px;transition:transform .25s}
.dish[aria-expanded="true"] .see svg{transform:rotate(180deg)}
.dish-desc{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.dish-photo{padding:2px 0 16px}
.dish-photo .frame{aspect-ratio:1/1;max-width:420px;border-radius:14px}
div.dish{cursor:default}
.more{display:flex;gap:10px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.more::-webkit-scrollbar{display:none}
.more .frame{flex:none;width:118px;aspect-ratio:3/4;border-radius:12px}
.more .frame::after{inset:5px;border-radius:9px}

.voices{position:relative;background:var(--butter-soft);border-radius:4px 20px 20px 20px;padding:20px 18px 18px;transform:rotate(-.4deg)}
.voices::before{content:"";position:absolute;top:-9px;right:26px;width:56px;height:18px;transform:rotate(4deg);opacity:.8;
  background:repeating-linear-gradient(45deg,var(--sky) 0 6px,var(--sky-soft) 6px 12px)}
.voices .label svg{color:var(--apple)}
.kw{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.kw span{font-size:13px;color:var(--ink);background:var(--card);border-radius:999px;padding:4px 11px;box-shadow:0 0 0 1px color-mix(in srgb,var(--butter) 35%,transparent)}
.kw span::before{content:"# ";color:var(--butter)}
.bubbles{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.bubbles li{background:var(--card);border-radius:4px 16px 16px 16px;padding:10px 14px 9px;max-width:92%}
.bubbles li:nth-child(even){justify-self:end;border-radius:16px 4px 16px 16px}
.bubbles q{display:block;font-size:15px;line-height:1.6;color:var(--ink);quotes:"“" "”"}
.bubbles cite{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.04em}

.where{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink-2)}
.where svg{width:16px;height:16px;color:var(--t);flex:none}
.where .addr{display:flex;align-items:center;gap:6px;min-width:0}
.where a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--t);padding-bottom:1px}

/* feedback */
.fb{margin-top:34px;background:var(--card);border-radius:24px;padding:22px 18px 20px;box-shadow:0 0 0 1px var(--line),0 12px 30px -22px rgba(42,53,85,.4)}
.fb h3{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.03em}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:15px 4px 12px;border:0;border-radius:18px;background:var(--paper);
  outline:1.5px dashed var(--line);outline-offset:-6px;font-family:var(--f-cute);font-size:15px;letter-spacing:.06em;color:var(--ink-2);transition:background .2s,color .2s,transform .15s}
.choice svg{width:30px;height:30px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.choice:hover{transform:translateY(-1px)}
.choice[aria-pressed="true"]{color:var(--ink)}
.choice[aria-pressed="true"] svg{transform:scale(1.15) rotate(-6deg)}
.choice.yes[aria-pressed="true"]{background:var(--apple-soft);outline-color:var(--apple);outline-style:dashed}
.choice.maybe[aria-pressed="true"]{background:var(--leaf-soft);outline-color:var(--leaf)}
.choice.no[aria-pressed="true"]{background:#EEF0F5;outline-color:var(--ink-3)}
.sub{font-size:13px;color:var(--ink-3);margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--ink-2);transition:all .15s}
.chip[aria-pressed="true"]{background:var(--sky-soft);border-color:var(--sky);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--sky)}
textarea,input[type="text"]{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);resize:vertical}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
textarea:focus,input:focus{outline:2px solid var(--sky-soft);border-color:var(--sky)}

/* ---------- final ---------- */
.final{padding-block:64px 40px;scroll-margin-top:60px}
.final h2,.result h2{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,38px);letter-spacing:.04em;margin-top:10px}
.final .intro{color:var(--ink-2);margin-top:10px;font-size:15.5px}
.rank{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.rank li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 10px 12px 14px;box-shadow:0 0 0 1px var(--line)}
.rank li:first-child{box-shadow:0 0 0 1.5px var(--apple)}
.rank .no{font-family:var(--f-display);font-weight:700;font-size:20px;width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink-2)}
.rank li:first-child .no{background:var(--apple);color:#fff}
.rank .who{flex:1;min-width:0}
.rank .who b{font-family:var(--f-display);font-weight:600;font-size:17px;display:block}
.rank .who span{font-size:12.5px;color:var(--ink-3)}
.mini{font-family:var(--f-cute);font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.mini.yes{background:var(--apple-soft);color:var(--apple)}
.mini.maybe{background:var(--leaf-soft);color:var(--leaf)}
.move{display:flex;gap:4px}
.move button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0}
.move button:disabled{opacity:.3;cursor:default}
.move svg{width:14px;height:14px}
.empty{margin-top:18px;border:1.5px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;color:var(--ink-3);font-size:14.5px}
.q{margin-top:30px}
.q .label svg{color:var(--pink)}
.done{margin-top:36px;width:100%;border:0;border-radius:999px;background:var(--apple);color:#fff;font-size:17px;font-weight:500;padding:16px;letter-spacing:.06em;
  box-shadow:0 10px 24px -12px var(--apple);transition:transform .2s}
.done:hover{transform:translateY(-2px)}
.hint{text-align:center;font-size:13px;color:var(--ink-3);margin-top:10px}

/* ---------- result ticket ---------- */
.result{padding-block:24px 56px;scroll-margin-top:60px}
.ticket{position:relative;margin-top:20px;background:var(--card);border-radius:22px;padding:26px 22px 22px;
  box-shadow:0 0 0 1px var(--line),0 18px 36px -24px rgba(42,53,85,.5);
  -webkit-mask:radial-gradient(circle 11px at 0 118px,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 118px,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 118px,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 118px,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .top{height:84px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ticket .top small{font-family:var(--f-cute);color:var(--ink-3);font-size:13px;letter-spacing:.12em}
.ticket .top strong{display:block;font-family:var(--f-display);font-size:26px;letter-spacing:.04em;line-height:1.3;margin-top:2px}
.stamp{flex:none;width:68px;height:68px;border-radius:50%;border:2px dashed var(--apple);color:var(--apple);display:grid;place-items:center;transform:rotate(12deg);font-family:var(--f-cute);font-size:13px;text-align:center;line-height:1.2}
.stamp svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.perf{border-top:2px dashed var(--line);margin:0 -4px 16px}
.ticket dl{margin:0;display:grid;gap:12px}
.ticket dl div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px;font-size:15px}
.ticket dt{color:var(--ink-3);font-size:13.5px;padding-top:1px}
.ticket dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.copy{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 24px;font-size:15.5px;font-weight:500}
.again{border:0;background:none;color:var(--ink-2);font-size:14.5px;text-decoration:underline;text-underline-offset:4px}
.copied{font-size:14px;color:var(--leaf)}
#plain{font-size:13.5px;min-height:180px}
footer{padding-block:24px 64px;text-align:center;font-family:var(--f-cute);color:var(--ink-3);letter-spacing:.12em;font-size:14px}

.demo{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--butter-soft);color:var(--ink-2);font-size:12px;padding:6px 12px;border-radius:999px;box-shadow:0 0 0 1px var(--line)}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .scene *{animation:none!important}
}
</style>
</head>
<body>


<!-- ============ SVG sprites ============ -->

    return `<a href="#r-${r.id}" aria-label="${esc(r.name)}"><g class="dish-stk">
      <use href="#food-${esc(r.icon || "sushi")}" x="${cx+dx-S/2}" y="${cy+dy-S/2-12}" width="${S}" height="${S}"/>
      <text x="${cx+dx}" y="${cy+dy+44}" text-anchor="middle">${esc(r.short || r.cuisine)}</text></g></a>`;
  }).join("");
  const star = (x,y,s,c,d) => `<use class="twk" href="#i-star" x="${x}" y="${y}" width="${s}" height="${s}" style="color:${c};animation-delay:${d}s"/>`;
  $("#scene").innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="196" fill="#FBE4EB"/>
    <circle cx="${cx}" cy="${cy}" r="184" fill="none" stroke="#E995AC" stroke-width="2.5" stroke-dasharray="7 6"/>
    <circle cx="${cx}" cy="${cy}" r="156" fill="#FFFFFF"/>
    <circle cx="${cx}" cy="${cy}" r="156" fill="none" stroke="#F3D3DC" stroke-width="3"/>
    ${foods}
    ${star(70,40,34,"#6F9BD6",0)}${star(540,30,26,"#E995AC",-1.4)}${star(560,170,20,"#6F9BD6",-2.6)}${star(20,250,22,"#E995AC",-.8)}
    <g class="bob"><use href="#fig-fork" x="-4" y="168" width="236" height="409"/></g>
    <g class="bob b2"><use href="#fig-chef" x="430" y="268" width="172" height="298"/></g>`;
})();
$("#dots").innerHTML = RESTAURANTS.map((r,i) => `<li><button type="button" data-go="r-${r.id}" aria-label="第 ${i+1} 家 ${esc(r.name)}">${i+1}</button></li>`).join("")
  + `<li><button type="button" class="final-dot" data-go="final">排序</button></li>`;
$("#days").innerHTML = DAYS.map(d => `<button type="button" class="chip" data-day="${d}" aria-pressed="${state.days.includes(d)}">${d}</button>`).join("");
$("#mood").innerHTML = MOODS.map(m => `<button type="button" class="chip" data-mood="${m}" aria-pressed="${state.mood===m}">${m}</button>`).join("");
$("#other").value = state.other || "";
if (DEMO) $("#demoTag").hidden = false;

/* ---------- interactions ---------- */
$("#list").addEventListener("click", e => {
  const spot = e.target.closest(".spot"); if (!spot) return;
  const id = spot.dataset.id, a = state.answers[id];

  const dish = e.target.closest("[data-dish]");
  if (dish){
    const open = dish.getAttribute("aria-expanded") !== "true";
    dish.setAttribute("aria-expanded", open);
    document.getElementById("dp-" + dish.dataset.dish).hidden = !open;
    return;
  }
  const ch = e.target.closest("[data-choice]");
  if (ch){
    const k = ch.dataset.choice;
    a.choice = a.choice === k ? null : k;
    spot.querySelectorAll("[data-choice]").forEach(b => b.setAttribute("aria-pressed", b.dataset.choice === a.choice));
    ch.classList.remove("pop"); void ch.offsetWidth; ch.classList.add("pop");
    syncOrder(); save(); renderDots(); renderRank();
    return;
  }
  const tg = e.target.closest("[data-tag]");
  if (tg){
    const t = tg.dataset.tag, i = a.tags.indexOf(t);
    i < 0 ? a.tags.push(t) : a.tags.splice(i,1);
    tg.setAttribute("aria-pressed", i < 0); save();
  }
});
$("#list").addEventListener("input", e => {
  if (!e.target.matches("[data-note]")) return;
  state.answers[e.target.closest(".spot").dataset.id].note = e.target.value; save();
});

$("#dots").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (b) document.getElementById(b.dataset.go).scrollIntoView();
});

function syncOrder(){
  const cand = RESTAURANTS.filter(r => ["yes","maybe"].includes(state.answers[r.id].choice)).map(r => r.id);
  state.order = state.order.filter(id => cand.includes(id));
  cand.forEach(id => {
    if (state.order.includes(id)) return;
    if (state.answers[id].choice === "yes"){
      const at = state.order.filter(x => state.answers[x].choice === "yes").length;
      state.order.splice(at, 0, id);
    } else state.order.push(id);
  });
}
const byId = id => RESTAURANTS.find(r => r.id === id);

function renderDots(){
  document.querySelectorAll("#dots [data-go^='r-']").forEach(b => {
    const c = state.answers[b.dataset.go.slice(2)].choice;
    c ? b.dataset.state = c : delete b.dataset.state;
  });
}
function renderRank(){
  const ol = $("#rank");
  $("#rankEmpty").hidden = state.order.length > 0;
  ol.innerHTML = state.order.map((id,i) => {
    const r = byId(id), c = state.answers[id].choice;
    return `<li>
      <span class="no">${i+1}</span>
      <span class="who"><b>${esc(r.name)}</b><span>${esc(r.cuisine)} · ${esc(r.area)}</span></span>
      <span class="mini ${c}">${CHOICE[c]}</span>
      <span class="move">
        <button type="button" data-mv="-1" data-i="${i}" aria-label="上移" ${i===0?"disabled":""}><svg><use href="#i-up"/></svg></button>
        <button type="button" data-mv="1" data-i="${i}" aria-label="下移" ${i===state.order.length-1?"disabled":""}><svg><use href="#i-down"/></svg></button>
      </span></li>`;
  }).join("");
}
$("#rank").addEventListener("click", e => {
  const b = e.target.closest("[data-mv]"); if (!b) return;
  const i = +b.dataset.i, j = i + (+b.dataset.mv);
  [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  save(); renderRank();
});
$("#days").addEventListener("click", e => {
  const b = e.target.closest("[data-day]"); if (!b) return;
  const d = b.dataset.day, i = state.days.indexOf(d);
  i < 0 ? state.days.push(d) : state.days.splice(i,1);
  b.setAttribute("aria-pressed", i < 0); save();
});
$("#mood").addEventListener("click", e => {
  const b = e.target.closest("[data-mood]"); if (!b) return;
  state.mood = state.mood === b.dataset.mood ? "" : b.dataset.mood;
  document.querySelectorAll("#mood .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.mood === state.mood)); save();
});
$("#other").addEventListener("input", e => { state.other = e.target.value; save(); });

/* ---------- result ---------- */
function summary(){
  const names = ids => ids.map(id => byId(id).name).join("、");
  const no = RESTAURANTS.filter(r => state.answers[r.id].choice === "no").map(r => r.id);
  const skipped = RESTAURANTS.filter(r => !state.answers[r.id].choice).map(r => r.id);
  const rows = [];
  if (state.order.length > 1) rows.push(["其次", names(state.order.slice(1))]);
  if (no.length) rows.push(["下次吧", names(no)]);
  if (skipped.length) rows.push(["没选", names(skipped)]);
  RESTAURANTS.forEach(r => {
    const a = state.answers[r.id], bits = [];
    if (a.tags.length) bits.push(a.tags.join("、"));
    if (a.note.trim()) bits.push("“" + a.note.trim() + "”");
    if (bits.length) rows.push([r.name, bits.join("；")]);
  });
  rows.push(["方便的时间", state.days.length ? DAYS.filter(d => state.days.includes(d)).join("、") : "都可以"]);
  if (state.mood) rows.push(["氛围", state.mood]);
  if (state.other.trim()) rows.push(["另外想去", state.other.trim()]);
  const first = state.order[0] ? byId(state.order[0]) : null;
  return {first, rows};
}
$("#doneBtn").addEventListener("click", () => {
  const {first, rows} = summary();
  $("#tFirst").textContent = first ? `${first.name}` : "还没选";
  $("#tRows").innerHTML = (first ? [["菜系", `${first.cuisine} · ${first.area}`]] : []).concat(rows)
    .map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("#plain").value = ["【餐厅选择】", "首选：" + (first ? first.name : "还没选")].concat(rows.map(([k,v]) => `${k}：${v}`)).join("\n");
  $("#plain").hidden = true; $("#copied").textContent = "";
  $("#result").hidden = false;
  $("#result").scrollIntoView();
});
$("#copyBtn").addEventListener("click", () => {
  const text = $("#plain").value;
  const fallback = () => { const t = $("#plain"); t.hidden = false; t.focus(); t.select(); $("#copied").textContent = "已选中文字，长按或用快捷键复制"; };
  try {
    navigator.clipboard.writeText(text).then(() => { $("#copied").textContent = "已复制，发给我就好"; }, fallback);
  } catch(e){ fallback(); }
});
$("#againBtn").addEventListener("click", () => $("#final").scrollIntoView());

/* ---------- nav position ---------- */
const label = $("#navLabel");
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const id = en.target.id;
    document.querySelectorAll("#dots button").forEach(b => b.classList.toggle("on", b.dataset.go === id));
    const idx = RESTAURANTS.findIndex(r => "r-" + r.id === id);
    label.textContent = idx >= 0 ? `第 ${idx+1} / ${N} 家` : (id === "final" ? "最后一步" : `一共 ${N} 家`);
  });
}, {rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll(".spot, #final").forEach(s => io.observe(s));

syncOrder(); renderDots(); renderRank();
</script>

</body>
</html>
